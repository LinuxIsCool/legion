# Neovim config — NVChad v2.5. The whole ~/.config/nvim IS the repo (no base/custom
# split as in v2.0). Full clone (not shallow) so it can be edited and pushed in place.
[".config/nvim"]
  type = "git-repo"
  url = "https://github.com/LinuxIsCool/legion-nvim.git"
  refreshPeriod = "168h"
  [".config/nvim".clone]
    args = ["--branch", "main"]
  [".config/nvim".pull]
    args = ["--ff-only"]
