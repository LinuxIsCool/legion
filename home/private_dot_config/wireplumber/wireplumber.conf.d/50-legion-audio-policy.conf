# legion2 audio policy: "the Pop!_OS feel".
# 1. Switching the output device moves EVERY stream (GNOME/PulseAudio behaviour).
#    With restore-target on, WirePlumber pins each app to the sink it last used,
#    so a device switch in the shell leaves half the apps behind (2026-09-06).
# 2. Never auto-switch Bluetooth headphones into HSP/HFP (mono 16 kHz, kills
#    stereo) just because an app opened a microphone. legion2 has exactly one
#    real mic, the ALC287 internal one; the headset mic is deliberately unused.
# The same two values are also saved via `wpctl settings --save` (sm-settings),
# which takes precedence; this file is the declarative record for chezmoi.
wireplumber.settings = {
  node.stream.restore-target = false
  bluetooth.autoswitch-to-headset-profile = false
}

# Capture consumers are anchored to the one physical mic. "Follow the default"
# is a latent failure for capture: a live recording can lose its source when a
# device appears or vanishes. Playback is free to follow the default sink.
stream.rules = [
  {
    matches = [
      { node.name = "voice-aec-capture" }
    ]
    actions = {
      update-props = {
        target.object = "alsa_input.pci-0000_07_00.6.analog-stereo"
      }
    }
  }
]
