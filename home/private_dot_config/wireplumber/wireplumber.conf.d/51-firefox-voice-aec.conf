# Firefox talks to voice agents (the Yami voice page) on laptop speakers, without headphones.
# Route Firefox's playback through the echo canceller's reference sink and its microphone through
# the echo-cancelled source (both from 12-voice-aec-source.conf), so what Firefox plays is removed
# from what Firefox hears. Other apps are untouched. Remove this file to undo.
stream.rules = [
  {
    matches = [
      { application.name = "Firefox", media.class = "Stream/Output/Audio" }
    ]
    actions = { update-props = { target.object = "voice-aec-sink" } }
  }
  {
    matches = [
      { application.name = "Firefox", media.class = "Stream/Input/Audio" }
    ]
    actions = { update-props = { target.object = "voice-aec-source" } }
  }
]
