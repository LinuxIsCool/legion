# Legion tmux config — XDG: ~/.config/tmux/tmux.conf
# Modular: settings → keys → mouse → plugins (TPM must run last)

source-file ~/.config/tmux/settings.conf
source-file ~/.config/tmux/keys.conf
source-file ~/.config/tmux/mouse.conf
source-file ~/.config/tmux/plugins.conf

# Runtime-generated plugin config (indicator format strings, hooks).
# Generated by claude-tmux-setup.sh, ignored by chezmoi.
# Overrides format strings from plugins.conf with indicator-injected versions.
# On fresh machines this file doesn't exist yet — if-shell guard skips it.
if-shell '[ -f ~/.config/tmux/plugins-dynamic.conf ]' \
  'source-file ~/.config/tmux/plugins-dynamic.conf'


# claude-voice focus tracking (2026-08-04).
# The voice arbiter runs in FOCUSED mode: only the focused pane speaks, all
# others queue SILENTLY AND FOREVER (queue.max_wait_seconds is effectively
# infinite by design). So if focus-state goes stale, voice goes 100% dark with
# no error anywhere. That is exactly what happened 2026-07-01 → 2026-08-04.
#
# Index [1] is deliberate: claude-tmux-setup.sh owns index [0] and calls
# `set-hook -gu after-select-pane` (unset ALL) before appending its own. Loading
# here — AFTER the plugins-dynamic.conf source above — keeps this hook alive
# across regeneration. If claude-tmux-setup.sh is re-run against a live server,
# re-apply these three lines (or just `tmux source ~/.config/tmux/tmux.conf`).
#
# Use "$HOME" (expanded by the sh that run-shell spawns), NOT "~" — tmux
# escapes a literal tilde to "\~" when it stores the hook, which sh then fails
# to resolve (exit 127, silently, in the background). Verified 2026-08-04.
set-hook -g after-select-pane[1] 'run-shell -b "$HOME/.claude/plugins/local/legion-plugins/plugins/claude-voice/scripts/tmux_focus_hook.sh"'
set-hook -g after-select-window[1] 'run-shell -b "$HOME/.claude/plugins/local/legion-plugins/plugins/claude-voice/scripts/tmux_focus_hook.sh"'
set-hook -g client-focus-in[1] 'run-shell -b "$HOME/.claude/plugins/local/legion-plugins/plugins/claude-voice/scripts/tmux_focus_hook.sh"'

# Fix: override tmux 3.5+ default status-style (ugly green bar)
# Loads last so it survives dynamic conf regeneration
set -g status-style bg=#262626,fg=#8a8a88
set -g window-status-current-style "fg=#fffafa,bg=#3a3a38,bold"
set -g window-status-style "fg=#6a6a6a"
