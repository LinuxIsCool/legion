# Play inside Kitty (works through tmux): mpv --profile=term <file>
[term]
vo=kitty
vo-kitty-use-shm=yes
vo-kitty-auto-multiplexer-passthrough=yes
hwdec=auto
profile=sw-fast
# keep the clock visible and show the seek bar on every seek
osd-level=3
osd-status-msg=${time-pos} / ${duration}  ${?pause==yes:PAUSED}
osd-bar=yes
# loop by default, and never quit when seeking past the end
loop-file=inf
keep-open=yes
