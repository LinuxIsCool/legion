# Arrows scrub 1 second (exact). Up/Down keep 5 seconds.
RIGHT seek  1 exact
LEFT  seek -1 exact
UP    seek  5 exact
DOWN  seek -5 exact
# Images: zoom, pan, reset, true pixels.
=  add video-zoom  0.25
-  add video-zoom -0.25
h  add video-pan-x  0.05
l  add video-pan-x -0.05
k  add video-pan-y  0.05
j  add video-pan-y -0.05
0  set video-zoom 0; set video-pan-x 0; set video-pan-y 0; set video-unscaled no
1  cycle-values video-unscaled yes no
